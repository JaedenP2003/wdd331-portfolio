<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nth-child() Demo</title>
    <style>
        #demo-list {
            list-style: none;
            padding: 0;
            max-width: 300px;
            }

            #demo-list li {
            padding: 0.75rem;
            }

            /* #demo-list li:nth-child(even of :not([hidden])) {
            background: #f1f5f9;
            } */

            #demo-list li:nth-child(even) {
                background: #f1f5f9;
            }

            #demo-list li.featured {
            font-weight: bold;
            }
    </style>
</head>
<body>
    <nav class="site-nav" aria-label="Main">
        <span class="brand">Jaeden Platt</span>
        <ul>
            <li><a href="unit-1/custom-properties/index.html">Custom Properties and Nesting</a></li>
            <li><a href="unit-1/choose-topic/demo.html">nth-child() Demo</a></li>
            <li><a href="unit-2/layered-components/index.html">Layered Components</a></li>
            <li><a href="unit-2/lightning-css-demo/index.html">Lightning CSS Demo</a></li>
        </ul>
        <details class="theme-menu">
            <summary class="theme-control">
                <span class="visually-hidden">Color scheme</span>
            </summary>
            <div class="theme-extra" role="group" aria-label="Choose color scheme">
                <label class="theme-control theme-pick" data-theme-pick="light">
                    <input name="theme-preference" type="radio" value="light">
                    <span aria-hidden="true">&#9788;&#65039;</span>
                    <span class="visually-hidden">Light</span>
                </label>
                <label class="theme-control theme-pick" data-theme-pick="system">
                    <input name="theme-preference" type="radio" value="system" checked>
                    <span aria-hidden="true">&#9881;&#65039;</span>
                    <span class="visually-hidden">System default</span>
                </label>
                <label class="theme-control theme-pick" data-theme-pick="dark">
                    <input name="theme-preference" type="radio" value="dark">
                    <span aria-hidden="true">&#127766;</span>
                    <span class="visually-hidden">Dark</span>
                </label>
            </div>
        </details>
    </nav>
    <ul id="demo-list">
        <li>Apples</li>
        <li class="featured">★ Bananas</li>
        <li>Cherries</li>
        <li class="featured">★ Dates</li>
        <li>Elderberries</li>
        <li>Figs</li>
        <li class="featured">★ Grapes</li>
        <li>Honeydew</li>
    </ul>

    <button id="toggle">Hide non-featured items</button>
    <script>
        const listItems = document.querySelectorAll("#demo-list li");
        const toggleButton = document.querySelector("#toggle");

        toggleButton.addEventListener("click", () => {
        listItems.forEach((item) => {
            item.hidden = !item.classList.contains("featured");
        });
        });
    </script>
</body>

</html>
